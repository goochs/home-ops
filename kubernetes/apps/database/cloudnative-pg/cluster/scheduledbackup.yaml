---
# yaml-language-server: $schema=https://schemas.serek.xyz/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres18
spec:
  backupOwnerReference: self
  cluster:
    name: postgres18
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "@daily"
