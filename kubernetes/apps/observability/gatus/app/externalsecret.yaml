---
# yaml-language-server: $schema=https://schemas.serek.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  dataFrom:
    - extract:
        key: gatus
    - extract:
        key: pushover
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepass-connect
  target:
    name: gatus-secret
    template:
      data:
        APPLICATION_TOKEN: "{{ .gatusPushoverToken }}"
        STORAGE_PATH: "postgres://{{.dbUser}}:{{.dbPass}}@postgres18-rw.database.svc.cluster.local/gatus"
        USER_KEY: "{{ .pushoverUserKey }}"
